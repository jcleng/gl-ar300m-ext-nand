# Description: Build ImmortalWrt 25.12 (v25.12.2) for GL.iNet GL-AR300M (NAND)
#

name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
  # schedule:
  #   - cron:  '22 16 * * 2,4'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  # 上游：ImmortalWrt 最新稳定版 tag（与软件源 / 镜像完全一致）
  SOURCE_URL: https://github.com/immortalwrt/immortalwrt
  SOURCE_BRANCH: v25.12.2
  # easytier 固定版本，避免上游 main 变动导致构建结果不可复现
  EASYTIER_TAG: v2.6.4

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 释放 runner 磁盘：上一次构建失败的根因就是磁盘写满
    - name: Free disk space
      run: |
        echo "=== before ==="
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /usr/local/share/boost \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/chromium \
          /usr/share/swift \
          /usr/local/graalvm \
          /usr/local/.ghcup \
          /usr/local/julia* \
          /usr/lib/jvm \
          /usr/local/sqlpackage \
          /usr/local/share/powershell \
          /usr/local/share/vcpkg \
          /opt/az \
          /opt/microsoft \
          /opt/google \
          /opt/pipx \
          /usr/share/miniconda \
          /usr/share/az_* \
          /usr/share/gradle* \
          /usr/share/kotlin* \
          /usr/share/sbt \
          /usr/share/heroku \
          /usr/share/mercurial \
          /usr/share/ri \
          || true
        sudo apt-get -qq clean
        sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb
        # Docker 镜像与旧内核（runner 上占几个 G）
        sudo rm -rf /var/lib/docker /var/lib/containerd || true
        echo "=== after ==="
        df -h /

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "nproc: $(nproc)"
        free -h
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
          subversion time tree jq
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone -b "$SOURCE_BRANCH" --single-branch --depth=1 "$SOURCE_URL" openwrt
        cd openwrt
        echo "SOURCE_REV=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        git log -1 --oneline

    # 官方 feeds 已包含全部所需插件，不再追加 kenzok8（master-only，25.12 上不可用）
    - name: Add easytier
      run: |
        git clone -b "$EASYTIER_TAG" --depth=1 https://github.com/EasyTier/luci-app-easytier easytier-src
        # Makefile 里是 -include $(dir $(lastword $(MAKEFILE_LIST)))../version.mk
        # 所以 version.mk 必须位于 openwrt/package/version.mk
        cp -f  ./easytier-src/version.mk            openwrt/package/version.mk
        cp -ar ./easytier-src/easytier              openwrt/package/
        cp -ar ./easytier-src/luci-app-easytier     openwrt/package/
        ls -l openwrt/package/version.mk
        ls -d  openwrt/package/easytier openwrt/package/luci-app-easytier

    - name: feeds update and install
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load .config
      run: |
        cp ./.config openwrt/.config
        cd openwrt
        rm -rf ./bin ./build_dir ./tmp ./staging_dir
        make defconfig
        echo "=== 生效的 target / device ==="
        grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)' .config || true

    # make defconfig 会静默丢弃找不到的包，这里显式校验，避免"构建成功但插件缺失"
    - name: Verify required packages are enabled
      run: |
        cd openwrt
        missing=0
        for sym in \
          luci-app-passwall luci-app-easytier luci-app-zerotier luci-app-ksmbd \
          luci-app-diskman luci-app-ttyd luci-app-ddns luci-app-upnp \
          luci-app-nlbwmon luci-app-sqm luci-app-aria2 luci-app-wol \
          luci-app-autoreboot luci-app-cpulimit luci-app-commands \
          luci-theme-argon luci-app-argon-config luci-proto-wireguard \
          kmod-fs-ext4 kmod-fs-vfat kmod-fs-exfat kmod-fs-ntfs3 kmod-usb-storage kmod-usb-ohci kmod-usb-uhci \
          ksmbd-server ; do
          if grep -qE "^CONFIG_PACKAGE_${sym}=[ym]$" .config; then
            echo "  OK   ${sym}"
          else
            echo "  MISS ${sym}"
            missing=1
          fi
        done
        if [ "$missing" != "0" ]; then
          echo "::error::缺少必需的软件包，请检查 .config 与 feeds"
          exit 1
        fi

    - name: Set LAN IP to 192.168.8.1
      run: |
        cd openwrt
        sed -i "s/192\.168\.1\.1/192.168.8.1/" package/base-files/files/bin/config_generate
        grep -n 'lan) ipad' package/base-files/files/bin/config_generate

    # 把仓库里的 files/ 覆盖层塞进镜像（OpenWrt 只认 $(TOPDIR)/files）
    # 内容：wifi-mgmt-guard —— 保证上游/中继链路断开后，WiFi 管理热点仍在
    - name: Install files/ overlay (wifi-mgmt-guard)
      run: |
        cd openwrt
        rm -rf ./files
        cp -a ../files ./files
        # git 会丢掉可执行位，这里显式补回来
        chmod +x files/etc/init.d/* files/etc/uci-defaults/*
        ls -l files/etc/init.d files/etc/uci-defaults
        # 校验脚本语法（busybox ash 兼容，但本地 sh 也能查出明显语法错）
        sh -n files/etc/init.d/wifi-mgmt-guard
        sh -n files/etc/uci-defaults/99-wifi-mgmt-guard
        # 校验 uci-defaults / init 脚本可被识别
        test -x files/etc/init.d/wifi-mgmt-guard
        test -x files/etc/uci-defaults/99-wifi-mgmt-guard
        echo '=== overlay OK ==='

    - name: make download
      run: |
        cd openwrt
        # make download 会校验每个文件的 hash，缺包/校验失败立即退出
        make -j$(nproc) download V=s

    - name: make
      run: |
        cd openwrt
        # pipefail：make 失败时能正确传递退出码
        set -o pipefail
        make -j$(($(nproc)+1)) V=s 2>&1 | tee build.log
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "SOURCE_REV=$SOURCE_REV" >> $GITHUB_ENV

    - name: Upload build log (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log${{ env.DEVICE_NAME }}
        path: openwrt/build.log
        if-no-files-found: ignore
        retention-days: 14

    - name: Collect firmware
      id: organize
      run: |
        cd openwrt/bin/targets/*/*
        # packages/ 里是编译出的全部 apk，上百 MB，发布时不需要
        rm -rf packages
        echo "RELEASE_PATH=$PWD" >> $GITHUB_ENV
        ls -lh

    - name: Artifacts File Save
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.RELEASE_PATH }}
        if-no-files-found: error
        retention-days: 30

    - name: Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        name: ImmortalWrt 25.12.2 ${{ env.DEVICE_NAME }} ${{ env.FILE_DATE }}
        body: |
          ImmortalWrt 25.12.2 (${{ env.SOURCE_BRANCH }} @ ${{ env.SOURCE_REV }}) for GL.iNet GL-AR300M (NAND)

          - LAN: 192.168.8.1
          - 包管理器: APK (`apk add`)
          - 提供系统升级文件（sysupgrade.bin）和厂商回复镜像（factory.img）
        files: ${{ env.RELEASE_PATH }}/*
        fail_on_unmatched_files: true
